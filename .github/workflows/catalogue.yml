# The catalogue build. Every Sunday it runs the whole pipeline -- every unit test,
# every audit and the measure gate -- on a warm source cache, and stores the
# resulting artifact as a run artifact. It NEVER publishes on its own: publishing
# is public distribution, so it happens only when a human presses "Run workflow"
# with publish = true (the maintainer's go-ahead, CLAUDE.md "Deploys").
#
# Every step keys on the one before it: a rebuild that fails at any gate stops
# the job, so the manifest, the upload and the publish never see a half-built or
# stale artifact. Never add `if: always()` / `continue-on-error` to a step here --
# the one exception is the source-cache save at the end, which ships nothing.
name: catalogue

on:
  schedule:
    - cron: '0 9 * * 0'          # Sunday 09:00 UTC — build + gates, never publish
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the artifact to the metadata release (the human gate)'
        type: boolean
        default: false
      cold_start:
        description: 'Build without the published artifact (first build only; ids are assigned cold)'
        type: boolean
        default: false

permissions:
  contents: read

# One build at a time; a dispatched run queues behind the scheduled one instead
# of racing it for the cache and the release.
concurrency: catalogue

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENTOME_CI: '1'
      # docs/carried-ids.md: without the published artifact every id is assigned cold; only a
      # deliberate dispatch with cold_start may build (and publish) that
      OPENTOME_COLD_START: ${{ inputs.cold_start && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Restores the newest `opentome-cache-*` entry (seed, keepalive or a previous
      # build); the last step saves this run's cache under its own key (run id + attempt), so the
      # responses a run fetched are there for the next one. A warm run hits close to
      # zero network -- the seed-cache workflow is what makes the first run warm. Beyond the
      # source refresh windows below, one more recurring cost: Open Library per-ISBN negatives refresh every
      # OL_NEG_REFRESH_DAYS (60, tier1/enrich_more.py) days by mtime, so once they age
      # past that window a build re-requests them -- ~77 requests on today's 3,833
      # negatives (ceil(3833/50)), first wave ~2026-11-26.
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: .cache
          key: opentome-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: opentome-cache-
          fail-on-cache-miss: true
      - name: cache state
        run: du -sh .cache 2>/dev/null || { echo "::error::no opentome-cache-* entry restored — run the seed-cache workflow first"; exit 1; }
      # tier0/rebuild_all.sh carries the integer series ids forward from
      # build/manga-metadata.sqlite when it exists (ID_CARRY) -- the ids are a
      # public contract, so CI must start from the last PUBLISHED artifact, not
      # from nothing. Anonymous: the release is public. The stale file this leaves
      # in build/ is only ever replaced by a rebuild that passed every gate (the
      # final mv in the script); a failed rebuild stops the job before any later
      # step could ship it.
      - name: restore id carry
        run: |
          mkdir -p build
          curl -fsSL --retry 3 -o build/manga-metadata.sqlite \
            https://github.com/opentomedb/mangarr-metadata/releases/download/metadata/manga-metadata.sqlite \
            || { rm -f build/manga-metadata.sqlite
                 if [ "$OPENTOME_COLD_START" = "1" ]; then
                   echo "::warning::no published artifact to carry ids from — cold start (cold_start=true)"
                 else
                   echo "::error::no published artifact to carry ids from — refusing a cold id assignment (dispatch with cold_start only for a deliberate cold start)"
                   exit 1
                 fi; }
          # the release this build replaces: publish.sh refuses unless the artifact carried from it
          if [ -f build/manga-metadata.sqlite ]; then sha256sum build/manga-metadata.sqlite | cut -d' ' -f1 > build/carry.sha256; fi
      # lx2.loc.gov:210 is plain HTTP on a non-standard port (docs/krcn-design.md §3). If a runner cannot
      # reach it, this run builds LoC from the cache (LOC_OFFLINE=1: the seed's complete sets and the
      # cached canary) and says so; any LoC set missing from the cache then fails the build loudly.
      # Each probe is a live request, so it goes to the source's netlog in tier0/lib_sru.py's
      # columns (start, status 200 / HTTP<code> / ERR, seconds, bytes, url). A fallback is traced,
      # never blocking (P13): LOC_UNREACHABLE / BNF_UNREACHABLE make stage 3f write the non-blocking
      # meta loc:offline / bnf:offline (stale sets counted) and a line in build/krcn-report.json.
      - name: LoC reachability
        run: |
          mkdir -p build
          url="http://lx2.loc.gov:210/lcdb?version=1.1&operation=searchRetrieve&query=bath.isbn%3D9781975319434&recordSchema=marcxml&maximumRecords=1&startRecord=1"
          start=$(date +%Y-%m-%dT%H:%M:%S.%3N)
          if out=$(curl -fsS -m 20 -o /dev/null -w '%{http_code} %{size_download} %{time_total}' -A "OpenTome-CI/1.0 (reachability probe)" "$url"); then ok=1; else ok=0; fi
          read -r code size secs <<< "${out:-000 0 0}"
          if [ "$ok" = 1 ]; then status=200; elif [ "$code" = 000 ]; then status=ERR; size=0; else status="HTTP$code"; size=0; fi
          printf '%s\t%s\t%.2f\t%s\t%s\n' "$start" "$status" "$secs" "$size" "$url" >> build/loc-netlog.tsv
          if [ "$ok" = 1 ]; then
            echo "LoC reachable"
          else
            echo "::warning::lx2.loc.gov:210 unreachable from this runner -- LoC is read from the cache (LOC_OFFLINE=1)"
            echo "LOC_OFFLINE=1" >> "$GITHUB_ENV"
            echo "LOC_UNREACHABLE=1" >> "$GITHUB_ENV"
          fi
      # The same fallback for BnF (spec §3 names both LOC_OFFLINE and BNF_OFFLINE): one HEAD-sized probe.
      - name: BnF reachability
        run: |
          mkdir -p build
          url="https://catalogue.bnf.fr/api/SRU?version=1.2&operation=searchRetrieve&query=bib.isbn%20all%20%229782382880371%22&recordSchema=unimarcxchange&maximumRecords=1"
          start=$(date +%Y-%m-%dT%H:%M:%S.%3N)
          if out=$(curl -fsS -m 20 -o /dev/null -w '%{http_code} %{size_download} %{time_total}' -A "OpenTome-CI/1.0 (reachability probe)" "$url"); then ok=1; else ok=0; fi
          read -r code size secs <<< "${out:-000 0 0}"
          if [ "$ok" = 1 ]; then status=200; elif [ "$code" = 000 ]; then status=ERR; size=0; else status="HTTP$code"; size=0; fi
          printf '%s\t%s\t%.2f\t%s\t%s\n' "$start" "$status" "$secs" "$size" "$url" >> build/bnf-netlog.tsv
          if [ "$ok" = 1 ]; then
            echo "BnF reachable"
          else
            echo "::warning::catalogue.bnf.fr unreachable from this runner -- BnF is read from the cache (BNF_OFFLINE=1)"
            echo "BNF_OFFLINE=1" >> "$GITHUB_ENV"
            echo "BNF_UNREACHABLE=1" >> "$GITHUB_ENV"
          fi
      # The measure gate's library fixture is a real collection, kept out of git: written from a
      # secret, read only by the gate, whose per-series report (build/measure-library.log) is
      # never printed or uploaded. No secret (a fork) -> the build fails at 8d by design.
      - name: library fixture (private)
        env:
          LIBRARY_JSON: ${{ secrets.OPENTOME_LIBRARY_JSON }}
        run: |
          if [ -n "$LIBRARY_JSON" ]; then
            printf '%s' "$LIBRARY_JSON" | base64 -d > export/fixtures/library.json
            echo "library fixture written"
          else
            echo "::warning::OPENTOME_LIBRARY_JSON is not set -- the measure gate will fail"
          fi
      # Runs every stage including the measure gate (8d, writes build/measure.log)
      # and exits non-zero on any test, audit, contract or coverage failure.
      # DNB freshness window (Nick 2026-09-24: a weekly refresh, no manual step): the build
      # re-reads last year, this year and later and the no-year remainder when older than 6
      # days -- 6, not 7: the cache files are ~7 days old at the next Sunday run, and a 7-day
      # window on a 7-day cron is not reliably "older", so alternate weeks would be skipped.
      # ~62 SRU requests a week at >= 3 s, plus up to 42 small recounts when a total moved.
      # A DNB failure in a refresh run keeps each affected result set's previous complete page
      # set and marks the build degraded (built and gated, never published); a result set with
      # no complete earlier set fails the build (an unseeded cache is not a refresh).
      - name: rebuild (every gate)
        env:
          DNB_REFRESH_DAYS: "6"
          # KR/CN sources (docs/krcn-design.md §3): LoC ECIP records are upgraded later; BnF barely moves.
          # A 28-day window on the weekly cron: ~110-160 LoC and ~11 BnF requests every fourth week, the
          # canary (1 request) every week. A failure keeps the previous complete set and marks the build
          # degraded (built and gated, never published); a set with no complete copy fails the build.
          LOC_REFRESH_DAYS: "28"
          BNF_REFRESH_DAYS: "28"
          # a runaway LoC pager stops at 260 live requests (lib_sru SourceBudget; a full refresh is ~110-160)
          LOC_MAX_REQUESTS: "260"
        run: bash tier0/rebuild_all.sh
      # Without PUBLISH=1 publish.sh only writes build/version.json and prints the
      # per-build tag; it also runs the two clean-room refusals.
      - name: manifest (dry run)
        run: CARRY_SHA256="$(cat build/carry.sha256 2>/dev/null || true)" bash export/publish.sh
      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/manga-metadata.sqlite
            build/version.json
            build/anilist-resolve-report.tsv
            build/measure.log
            build/status-transitions.tsv
            build/round-c-report.tsv
            build/round-c-anilist.tsv
            build/round-c-unmatched-disambiguators.tsv
            build/round-c-mainless.tsv
            build/dnb-review.tsv
            build/dnb-report.json
            build/dnb-netlog.tsv
            build/krcn-review.tsv
            build/krcn-held.tsv
            build/krcn-new-works.tsv
            build/krcn-duplicates.tsv
            build/krcn-anilist-bindings.tsv
            build/krcn-report.json
            build/loc-report.json
            build/loc-netlog.tsv
            build/bnf-netlog.tsv
      # The human gate. The PAT (not GITHUB_TOKEN) is what writes to the
      # mangarr-metadata releases, so this workflow needs no write permission.
      - name: publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.MANGARR_METADATA_TOKEN }}
        run: CARRY_SHA256="$(cat build/carry.sha256 2>/dev/null || true)" PUBLISH=1 bash export/publish.sh
      # Tell the Mangarr Discord server (#catalogue) what was published. The webhook URL is
      # the DISCORD_CATALOGUE_WEBHOOK secret; the step is skipped when it is not set.
      - name: announce on Discord
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && env.HOOK != '' }}
        env:
          HOOK: ${{ secrets.DISCORD_CATALOGUE_WEBHOOK }}
        run: |
          label=$(python3 -c "import json; print(json.load(open('build/version.json'))['gcd_dump'])")
          series=$(sqlite3 build/manga-metadata.sqlite 'SELECT COUNT(*) FROM series')
          volumes=$(sqlite3 build/manga-metadata.sqlite 'SELECT COUNT(*) FROM volumes')
          body=$(python3 - "$label" "$series" "$volumes" <<'EOF'
          import json, sys
          label, series, volumes = sys.argv[1:4]
          print(json.dumps({"username": "OpenTome", "embeds": [{
              "title": f"Catalogue published: {label}", "color": 0x7a43b6,
              "url": "https://github.com/opentomedb/mangarr-metadata/releases/tag/" + label,
              "description": f"{int(series):,} series, {int(volumes):,} volumes.\nMangarr picks it up on its next daily check."}]}))
          EOF
          )
          curl -sS -o /dev/null -w 'discord: %{http_code}\n' -A "OpenTome-CI/1.0" -H 'Content-Type: application/json' --data "$body" "$HOOK"
      # Saves the source cache, also when a gate after stage 3f failed: that run's LoC / BnF / DNB
      # fetches reach the next run instead of being re-requested from a gateway that throttled us.
      # Only once tier0/rebuild_all.sh wrote build/sources-complete.marker (after 3f, every library set
      # enumerated and stored whole); a failure or kill before it saves nothing, as before. Never on a
      # cancelled run, never over an exact hit -- the old combined step's behaviour; the key carries the
      # attempt, so a re-run attempt restores the newest entry by prefix and saves its own.
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && hashFiles('build/sources-complete.marker') != '' && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: .cache
          key: opentome-cache-${{ github.run_id }}-${{ github.run_attempt }}
